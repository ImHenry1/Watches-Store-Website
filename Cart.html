<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luxury Watch Cart</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        /* NAVBAR */
        .navbar{
            background-color: black;
        }

        .navbar-brand{
            color: gold !important;
            font-size: 30px;
            font-weight: bold;
        }

        .nav-link{
            color: white !important;
        }

        .nav-link:hover{
            color: gold !important;
        }

        /* BANNER */
        .cart-banner{
            height: 300px;

            background:
            linear-gradient(rgba(0,0,0,0.6),
            rgba(0,0,0,0.6)),

            url('https://images.unsplash.com/photo-1524592094714-0f0654e20314?q=80&w=1200');

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            text-align: center;
        }

        .cart-banner h1{
            font-size: 60px;
            font-weight: bold;
        }

        /* CARD */
        .card{
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }

        /* IMAGE */
        .cart-img{
            height: 250px;
            object-fit: cover;
        }

        /* BUTTON */
        .btn-warning{
            background-color: gold;
            border: none;
            font-weight: bold;
        }

        .btn-warning:hover{
            background-color: #d4af37;
        }

        .qty-btn{
            width: 40px;
            height: 40px;
        }

        footer{
            background-color: black;
            color: white;
        }

    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark py-3">

        <div class="container">

            <a class="navbar-brand" href="#">
                WATCHES STORE
            </a>

            <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Trang chủ                        
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Shop
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active text-warning" href="#">
                            Giỏ hàng
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- BANNER -->
    <section class="cart-banner">

        <div>

            <h1>
                Shopping Cart
            </h1>

            <p class="lead">
                Premium Luxury Watches
            </p>

        </div>

    </section>

    <!-- CART -->
    <section class="py-5">

        <div class="container">

            <div class="row g-4">

                <!-- LEFT -->
                <div class="col-lg-8">

                    <div id="cart-items"></div>

                </div>

                <!-- RIGHT -->
                <div class="col-lg-4">

                    <div class="card shadow p-4">

                        <h2 class="fw-bold mb-4">
                            Biên lai đặt hàng
                        </h2>

                        <div class="d-flex justify-content-between mb-3">

                            <span>Giá hàng</span>

                            <span id="subtotal">
                                0đ
                            </span>

                        </div>

                        <div class="d-flex justify-content-between mb-3">

                            <span>Phí ship</span>

                            <span>
                                0đ
                            </span>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <h4>Thành tiền</h4>

                            <h4 class="text-warning" id="total">
                                0đ
                            </h4>

                        </div>

                        <!-- CHECKOUT -->
                        <button class="btn btn-warning w-100 py-3 mt-4"
                        onclick="checkout()">

                            Đặt hàng

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="text-center py-4">

        <p class="mb-0">
            © 2026 Luxury Watch Store
        </p>

    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
